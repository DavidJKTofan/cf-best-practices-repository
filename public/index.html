<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Cloudflare L7 Best Practices</title>
		<meta
			name="description"
			content="A searchable collection of security, performance, and reliability best practices for Cloudflare application (Layer 7) services."
		/>
		<meta name="robots" content="noindex, nofollow" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)" />
		<script>
			// Apply the theme before first paint so dark-mode users never see a light flash
			(function () {
				var t;
				try {
					t = localStorage.getItem('theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = t;
			})();
		</script>
		<!-- Start the data request in parallel with CSS/JS instead of after app.js runs -->
		<link rel="preload" href="/api/practices" as="fetch" crossorigin />
		<link rel="stylesheet" href="/style.css" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<script src="/theme.js" type="module"></script>
		<script src="/app.js" type="module"></script>
	</head>
	<body>
		<a href="#results" class="skip-link">Skip to results</a>

		<header class="site-header">
			<div class="container header-inner">
				<a class="brand" href="/">
					<img src="/favicon.png" width="28" height="28" alt="" />
					<h1>Cloudflare L7 Best Practices</h1>
				</a>
				<div class="header-actions">
					<a
						class="icon-btn github-link"
						href="https://github.com/DavidJKTofan/cf-best-practices-repository"
						target="_blank"
						rel="noopener noreferrer"
						aria-label="Source code on GitHub"
						title="Source code on GitHub"
					>
						<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
							<path
								d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
							/>
						</svg>
					</a>
					<button class="icon-btn theme-switch" type="button" aria-label="Toggle color theme" title="Toggle color theme">
						<svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
							<path d="M20.35 15.35A9 9 0 0 1 8.65 3.65 9 9 0 1 0 20.35 15.35Z" />
						</svg>
						<svg
							class="icon-sun"
							width="20"
							height="20"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							aria-hidden="true"
						>
							<circle cx="12" cy="12" r="4" />
							<path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
						</svg>
					</button>
				</div>
			</div>
		</header>

		<main id="main">
			<section class="toolbar" aria-label="Search and filters">
				<div class="container">
					<div class="controls">
						<div class="search">
							<svg
								class="search-icon"
								width="18"
								height="18"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								aria-hidden="true"
							>
								<circle cx="11" cy="11" r="7" />
								<path d="m20 20-3.5-3.5" stroke-linecap="round" />
							</svg>
							<label for="search" class="visually-hidden">Search practices</label>
							<input
								id="search"
								type="search"
								placeholder="Search practices…"
								autocomplete="off"
								spellcheck="false"
								enterkeyhint="search"
								aria-keyshortcuts="/ Control+K Meta+K"
							/>
							<kbd class="search-hint" aria-hidden="true">/</kbd>
						</div>
						<button class="btn filters-toggle" type="button" aria-expanded="false" aria-controls="filters">
							<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
								<path d="M3 5h18M6 12h12M10 19h4" stroke-linecap="round" />
							</svg>
							Filters
							<span class="filter-count" hidden></span>
						</button>

						<div id="filters" class="filters">
							<label class="visually-hidden" for="filter-category">Category</label>
							<select id="filter-category" data-filter="category">
								<option value="">All categories</option>
							</select>
							<label class="visually-hidden" for="filter-feature">Feature</label>
							<select id="filter-feature" data-filter="feature">
								<option value="">All features</option>
							</select>
							<label class="visually-hidden" for="filter-domain">Domain</label>
							<select id="filter-domain" data-filter="domain">
								<option value="">All domains</option>
							</select>
							<label class="visually-hidden" for="filter-level">Recommendation level</label>
							<select id="filter-level" data-filter="level">
								<option value="">All levels</option>
							</select>
							<label class="visually-hidden" for="filter-impact">Impact</label>
							<select id="filter-impact" data-filter="impact">
								<option value="">Any impact</option>
							</select>
							<label class="visually-hidden" for="filter-difficulty">Difficulty</label>
							<select id="filter-difficulty" data-filter="difficulty">
								<option value="">Any difficulty</option>
							</select>
							<button id="reset" class="btn btn-ghost" type="button" disabled>Reset</button>
						</div>
					</div>

					<div class="results-bar">
						<p id="summary" class="summary" role="status" aria-live="polite">Loading practices…</p>
						<button id="toggle-all" class="btn btn-link" type="button" disabled>Expand all</button>
					</div>
				</div>
			</section>

			<div class="container">
				<div id="results" class="table-wrap" tabindex="-1">
					<table class="practices">
						<caption class="visually-hidden">
							Cloudflare best practices. Select a practice title to show its description, configuration, and sources.
						</caption>
						<thead>
							<tr>
								<th scope="col" class="col-title" aria-sort="none"><button type="button" data-sort="title">Practice</button></th>
								<th scope="col" class="col-category" aria-sort="none"><button type="button" data-sort="category">Category</button></th>
								<th scope="col" class="col-domain" aria-sort="none"><button type="button" data-sort="domain">Domain</button></th>
								<th scope="col" class="col-level" aria-sort="none"><button type="button" data-sort="level">Level</button></th>
								<th scope="col" class="col-impact" aria-sort="none"><button type="button" data-sort="impact">Impact</button></th>
								<th scope="col" class="col-difficulty" aria-sort="none">
									<button type="button" data-sort="difficulty">Difficulty</button>
								</th>
								<th scope="col" class="col-feature" aria-sort="none"><button type="button" data-sort="feature">Feature</button></th>
							</tr>
						</thead>
						<tbody id="rows" aria-busy="true">
							<tr class="skeleton">
								<td colspan="7"></td>
							</tr>
							<tr class="skeleton">
								<td colspan="7"></td>
							</tr>
							<tr class="skeleton">
								<td colspan="7"></td>
							</tr>
							<tr class="skeleton">
								<td colspan="7"></td>
							</tr>
							<tr class="skeleton">
								<td colspan="7"></td>
							</tr>
							<tr class="skeleton">
								<td colspan="7"></td>
							</tr>
							<tr class="skeleton">
								<td colspan="7"></td>
							</tr>
							<tr class="skeleton">
								<td colspan="7"></td>
							</tr>
						</tbody>
					</table>
					<noscript><p class="state">This page needs JavaScript to load the best practices.</p></noscript>
				</div>
			</div>

			<button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top" hidden>
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
					<path d="m6 15 6-6 6 6" stroke-linecap="round" stroke-linejoin="round" />
				</svg>
			</button>
		</main>

		<footer class="site-footer">
			<div class="container">
				<p>
					Data served by Cloudflare Workers &amp; D1 ·
					<a href="https://github.com/DavidJKTofan/cf-best-practices-repository" target="_blank" rel="noopener noreferrer">GitHub</a> · A
					personal project for educational purposes only.
				</p>
			</div>
		</footer>
	</body>
</html>
